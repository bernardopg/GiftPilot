name: Report a bug
description: Something doesn't work as it should.
title: '[bug] '
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please check that a similar issue does not exist yet.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Open https://www.steamgifts.com/...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Autopilot
        - Background mode
        - Dark theme / pinned navbar
        - Filters / win odds
        - Settings
        - Notifications / key redemption
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GiftPilot version
      placeholder: '3.0.0'
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 155 / Brave 1.80 / Edge 155
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors
      description: Page console or service worker console (chrome://extensions → GiftPilot → "service worker"). Remove tokens and cookies.
      render: text
