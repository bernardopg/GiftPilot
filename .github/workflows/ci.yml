name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0' # weekly, catches toolchain/site drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with .nvmrc and the engines range in package.json.
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit
      - name: Metadata, i18n and unit tests
        run: npm run verify

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      # Runtime dependencies would ship to users: block on them.
      - name: Runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # Dev tooling never ships: report only, Dependabot will follow up.
      - name: Dev dependencies (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, audit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit
      - run: npm run package
      - name: Release notes must exist for this version
        run: node scripts/changelog-section.mjs > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: giftpilot-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve tag
        id: tag
        run: |
          VERSION="v$(node -p "require('./manifest.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${VERSION} already released, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes from CHANGELOG.md
        if: steps.tag.outputs.exists == 'false'
        run: |
          {
            node scripts/changelog-section.mjs
            echo
            echo '---'
            echo
            cat <<'NOTE'
          **Instalação:** baixe o `.zip`, extraia, abra `chrome://extensions`, ative o modo do desenvolvedor e use **Carregar sem compactação**.
          NOTE
          } > RELEASE_NOTES.md
      - uses: actions/download-artifact@v8
        if: steps.tag.outputs.exists == 'false'
        with:
          name: giftpilot-${{ github.sha }}
          path: dist
      - uses: softprops/action-gh-release@v3.0.3
        if: steps.tag.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: GiftPilot ${{ steps.tag.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*.zip
